[package]
name = "sw-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable, byte-oriented SolidWorks metadata reader"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
