name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SW_VIEWER_BROWSER_CHANNEL: chrome
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            viewer/target
            target
          key: ${{ runner.os }}-viewer-pages-${{ hashFiles('Cargo.lock', 'viewer/Cargo.lock') }}
      - name: Install matching WASM bindings tool
        run: |
          bindings_version=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;}' Cargo.lock)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $bindings_version" ]; then
            cargo install wasm-bindgen-cli --version "$bindings_version" --locked --force
          fi
      - name: Test parser-backed viewer model
        run: cargo test --locked
      - name: Build static viewer
        run: sh build.sh
      - run: npm ci
      - run: google-chrome --version
      - name: Browser smoke tests
        run: npm test
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-results
          path: viewer/test-results
      - name: Install documentation dependencies
        working-directory: .
        run: npm ci
      - name: Build documentation, Rust API and combined site
        working-directory: .
        run: npm run site:build
      - name: Check documentation navigation and search
        working-directory: .
        run: npm run site:test
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy viewer and documentation
        id: deployment
        uses: actions/deploy-pages@v4
